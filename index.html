<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Esempio di menu digitale bilingue con QR code, allergeni e filtri. Realizzato da Frigi.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Locanda Maestrale · Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
/* Layout: menu da telefono — testata, barra categorie fissa in alto, piatti in lista; leggibile al tavolo con una mano. */
:root{
  --bg:#f6f7f4;
  --card:#ffffff;
  --ink:#14233a;
  --muted:#5d6878;
  --line:#dde2e6;
  --accent:#d39a1c;      /* zafferano */
  --sea:#1f5f7a;
  --veg:#3c7d4a;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1722;--card:#162131;--ink:#e9edf2;--muted:#9aa6b6;--line:#26354a;--accent:#e8b23c;--sea:#6fb3cf;--veg:#79c48a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1722;--card:#162131;--ink:#e9edf2;--muted:#9aa6b6;--line:#26354a;--accent:#e8b23c;--sea:#6fb3cf;--veg:#79c48a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.demo{background:var(--accent);color:#1b1404;font-size:12.5px;font-weight:600;text-align:center;padding:6px 12px;letter-spacing:.02em}
header.top{padding-block:28px 18px;display:flex;flex-direction:column;gap:6px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14.5px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.today{margin-top:10px;border:1px dashed var(--accent);border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.today b{font-family:var(--f-display);font-weight:400;font-size:18px;display:block;margin-bottom:2px}
.today small{color:var(--muted)}
nav.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav.cats::-webkit-scrollbar{display:none}
nav.cats a{flex:none;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
nav.cats a.on{background:var(--sea);border-color:var(--sea);color:#fff}
section.cat{padding-top:22px;scroll-margin-top:64px}
section.cat h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px}
.cat-note{color:var(--muted);font-size:14px;margin:0 0 8px}
ul.dishes{list-style:none;margin:0;padding:0}
.dish{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 14px}
.dish:last-child{border-bottom:0}
.dish h3{margin:0;font-size:16.5px;font-weight:700;min-width:0}
.price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.desc{grid-column:1/-1;color:var(--muted);font-size:14.5px;max-width:60ch}
.tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.tag.typ{color:var(--accent)}
.tag.veg{color:var(--veg)}
.al{font-size:11.5px;color:var(--muted);padding:2px 0}
.al span{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink);font-weight:700;font-size:10.5px;margin-left:2px;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filters label{display:flex;gap:6px;align-items:center;font-size:14px;border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;cursor:pointer}
.filters input{accent-color:var(--sea)}
.legend{margin-top:28px;border-top:1px solid var(--line);padding-top:16px;font-size:13.5px;color:var(--muted)}
.legend h2{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--ink);margin:0 0 8px}
.legend ol{columns:2;column-gap:20px;padding-left:20px;margin:0}
.legend p{margin:12px 0 0}
footer{margin-top:28px;text-align:center;font-size:13px;color:var(--muted)}
footer b{color:var(--ink)}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
@media (max-width:380px){.legend ol{columns:1}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

<div class="demo" id="demo-bar">MENU DIMOSTRATIVO · locale e piatti inventati</div>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div>
        <h1>Locanda Maestrale</h1>
        <div class="sub" id="sub">Cucina sarda di mare e di terra</div>
      </div>
      <div class="lang" role="group" aria-label="Lingua">
        <button type="button" id="b-it" aria-pressed="true">IT</button>
        <button type="button" id="b-en" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="today" id="today"></div>
    <div class="filters">
      <label for="f-veg"><input type="checkbox" id="f-veg"> <span id="l-veg">Solo vegetariani</span></label>
      <label for="f-glu"><input type="checkbox" id="f-glu"> <span id="l-glu">Senza glutine</span></label>
    </div>
  </header>
  <nav class="cats" id="cats" aria-label="Categorie"></nav>
  <main id="menu"></main>
  <section class="legend" id="legend"></section>
  <footer id="foot"></footer>
</div>

<script>
(() => {
const T = {
  it:{sub:"Cucina sarda di mare e di terra", veg:"Solo vegetariani", glu:"Senza glutine", typ:"Tipico sardo", vg:"Vegetariano",
      todayT:"Piatto del giorno", todayS:"Chiedi al personale di sala per la disponibilità", al:"Allergeni",
      leg:"Allergeni (Reg. UE 1169/2011)", legNote:"I numeri accanto ai piatti indicano gli allergeni presenti. Per intolleranze o allergie chiedi sempre al personale.",
      cover:"Coperto € 2,50 · Acqua e pane carasau inclusi", empty:"Nessun piatto con questi filtri.",
      foot:"Menu digitale realizzato da <b>Frigi</b> · aggiornabile in tempo reale", demo:"MENU DIMOSTRATIVO · locale e piatti inventati"},
  en:{sub:"Sardinian cuisine from sea and land", veg:"Vegetarian only", glu:"Gluten free", typ:"Sardinian classic", vg:"Vegetarian",
      todayT:"Dish of the day", todayS:"Ask our staff for availability", al:"Allergens",
      leg:"Allergens (EU Reg. 1169/2011)", legNote:"Numbers next to each dish show the allergens it contains. Please always tell our staff about allergies or intolerances.",
      cover:"Cover charge € 2.50 · Water and carasau bread included", empty:"No dishes match these filters.",
      foot:"Digital menu by <b>Frigi</b> · updated in real time", demo:"DEMO MENU · fictional restaurant and dishes"}
};
const ALLERGENI = {
  it:["Glutine","Crostacei","Uova","Pesce","Arachidi","Soia","Latte","Frutta a guscio","Sedano","Senape","Sesamo","Solfiti","Lupini","Molluschi"],
  en:["Gluten","Crustaceans","Eggs","Fish","Peanuts","Soy","Milk","Tree nuts","Celery","Mustard","Sesame","Sulphites","Lupin","Molluscs"]
};
const TODAY = {it:"Fregola con arselle e bottarga di Cabras · € 17", en:"Fregola pasta with clams and Cabras bottarga · € 17"};
const MENU = [
  {id:"antipasti", it:"Antipasti", en:"Starters", items:[
    {it:["Tagliere del pastore","Salsiccia sarda, prosciutto di montagna, pecorino stagionato e carasau"],en:["Shepherd's board","Sardinian sausage, mountain ham, aged pecorino and carasau bread"],p:14,typ:1,al:[1,7]},
    {it:["Pane guttiau con pomodorini","Carasau tostato con olio, sale e pomodorini di campo"],en:["Guttiau bread with cherry tomatoes","Toasted carasau with olive oil, salt and field tomatoes"],p:6,typ:1,veg:1,al:[1]},
    {it:["Polpo alla campidanese","Polpo tenero, patate, olive e prezzemolo"],en:["Campidano-style octopus","Tender octopus, potatoes, olives and parsley"],p:13,al:[14]},
  ]},
  {id:"primi", it:"Primi", en:"First courses", items:[
    {it:["Culurgiones al pomodoro","Ravioli di patate, pecorino e menta, chiusi a spiga"],en:["Culurgiones with tomato","Potato, pecorino and mint ravioli with the wheat-ear seal"],p:14,typ:1,veg:1,al:[1,3,7]},
    {it:["Malloreddus alla campidanese","Gnocchetti sardi con ragù di salsiccia e zafferano"],en:["Malloreddus Campidano-style","Sardinian gnocchetti with sausage ragù and saffron"],p:13,typ:1,al:[1,7]},
    {it:["Spaghetti ai ricci","Ricci di mare freschi, aglio e olio (in stagione)"],en:["Sea urchin spaghetti","Fresh sea urchin, garlic and olive oil (in season)"],p:22,al:[1,14]},
  ]},
  {id:"secondi", it:"Secondi", en:"Main courses", items:[
    {it:["Porceddu arrosto","Maialino da latte al mirto, cotto a fuoco lento (su prenotazione)"],en:["Roast porceddu","Suckling pig with myrtle, slow-roasted (on request)"],p:22,typ:1,al:[]},
    {it:["Pescato del giorno","Alla griglia o all'acqua pazza, con verdure di stagione"],en:["Catch of the day","Grilled or in light tomato broth, with seasonal vegetables"],p:"5/hg",al:[4]},
    {it:["Melanzane al forno","Melanzane, pomodoro e pecorino gratinato"],en:["Baked aubergine","Aubergine, tomato and gratinated pecorino"],p:11,veg:1,al:[7]},
  ]},
  {id:"dolci", it:"Dolci", en:"Desserts", items:[
    {it:["Seadas al miele di corbezzolo","Sfoglia fritta ripiena di formaggio fresco e scorza di limone"],en:["Seadas with strawberry-tree honey","Fried pastry filled with fresh cheese and lemon zest"],p:7,typ:1,veg:1,al:[1,3,7]},
    {it:["Pardulas","Tortine di ricotta e zafferano"],en:["Pardulas","Ricotta and saffron tartlets"],p:6,typ:1,veg:1,al:[1,3,7]},
    {it:["Sorbetto al limone","Fatto in casa"],en:["Lemon sorbet","Homemade"],p:5,veg:1,al:[]},
  ]},
  {id:"bere", it:"Da bere", en:"Drinks", items:[
    {it:["Cannonau di Sardegna DOC","Calice / bottiglia"],en:["Cannonau di Sardegna DOC","Glass / bottle"],p:"6 / 24",typ:1,veg:1,al:[12]},
    {it:["Vermentino di Gallura DOCG","Calice / bottiglia"],en:["Vermentino di Gallura DOCG","Glass / bottle"],p:"6 / 26",typ:1,veg:1,al:[12]},
    {it:["Mirto della casa","Amaro di mirto rosso"],en:["House mirto","Red myrtle liqueur"],p:4,typ:1,veg:1,al:[]},
  ]},
];

let lang = "it";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const price = p => typeof p==="number" ? "€ "+p.toFixed(2).replace(".",",").replace(",00","") : "€ "+String(p).replace("hg", lang==="it"?"hg":"100g");

function render(){
  const t = T[lang], veg = $("f-veg").checked, glu = $("f-glu").checked;
  document.documentElement.lang = lang;
  $("b-it").setAttribute("aria-pressed", lang==="it"); $("b-en").setAttribute("aria-pressed", lang==="en");
  $("sub").textContent = t.sub; $("l-veg").textContent = t.veg; $("l-glu").textContent = t.glu; $("demo-bar").textContent = t.demo;
  $("today").innerHTML = `<b>${esc(t.todayT)}</b>${esc(TODAY[lang])}<br><small>${esc(t.todayS)}</small>`;
  $("cats").innerHTML = MENU.map((c,i)=>`<a href="#${c.id}"${i===0?' class="on"':""}>${esc(c[lang])}</a>`).join("");
  let any = false;
  $("menu").innerHTML = MENU.map(c=>{
    const items = c.items.filter(d=>(!veg||d.veg)&&(!glu||!d.al.includes(1)));
    if(!items.length) return "";
    any = true;
    return `<section class="cat" id="${c.id}"><h2>${esc(c[lang])}</h2>
      ${c.id==="antipasti"?`<p class="cat-note">${esc(t.cover)}</p>`:""}
      <ul class="dishes">${items.map(d=>`<li class="dish">
        <h3>${esc(d[lang][0])}</h3><span class="price">${esc(price(d.p))}</span>
        <div class="desc">${esc(d[lang][1])}</div>
        <div class="tags">${d.typ?`<span class="tag typ">${esc(t.typ)}</span>`:""}${d.veg?`<span class="tag veg">${esc(t.vg)}</span>`:""}
          ${d.al.length?`<span class="al" title="${esc(d.al.map(n=>ALLERGENI[lang][n-1]).join(", "))}">${esc(t.al)}${d.al.map(n=>`<span>${n}</span>`).join("")}</span>`:""}</div>
      </li>`).join("")}</ul></section>`;
  }).join("") || `<p class="cat-note" style="padding-top:20px">${esc(t.empty)}</p>`;
  $("legend").innerHTML = `<h2>${esc(t.leg)}</h2><ol>${ALLERGENI[lang].map(a=>`<li>${esc(a)}</li>`).join("")}</ol><p>${esc(t.legNote)}</p>`;
  $("foot").innerHTML = t.foot;
  spy();
}
$("b-it").onclick = ()=>{lang="it";render();};
$("b-en").onclick = ()=>{lang="en";render();};
$("f-veg").onchange = render; $("f-glu").onchange = render;

function spy(){
  const links = [...document.querySelectorAll("#cats a")];
  const secs = [...document.querySelectorAll("section.cat")];
  let cur = secs[0] && secs[0].id;
  secs.forEach(s=>{ if(s.getBoundingClientRect().top < 120) cur = s.id; });
  links.forEach(a=>{ const on = a.getAttribute("href")==="#"+cur; a.classList.toggle("on",on); if(on && a.scrollIntoView && document.activeElement!==a){ const n=$("cats"); n.scrollLeft = a.offsetLeft - 16; } });
}
addEventListener("scroll", spy, {passive:true});
render();
})();
</script>

</body>
</html>
